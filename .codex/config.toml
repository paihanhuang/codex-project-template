#:schema https://developers.openai.com/codex/config-schema.json
# Project-local Codex configuration for the V-Model template.
# Keep only template-scoped defaults here. Sandbox, approval, and full-access
# posture are intentionally controlled by the user-level Codex config so this
# template does not downgrade a global yolo/full-access default.

project_doc_max_bytes = 65536

[features]
multi_agent = true
shell_tool = true
shell_snapshot = true
skill_mcp_dependency_install = true
enable_request_compression = true
hooks = true

[agents]
max_threads = 6
max_depth = 1

[context_index]
enabled = true
config_file = ".codex/context.toml"
capsule_token_budget = 12000
max_index_age_hours = 24
require_fresh_for_edits = true
prefer_local_indexes = true
